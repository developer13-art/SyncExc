services:
  # 1. Backend API (Web Service)
  - type: web
    name: syncexc-server
    runtime: node
    plan: free # Change to 'starter' later to avoid sleep
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # Add all your .env variables here manually in the Render Dashboard
      # (Do NOT commit secrets to render.yaml)

  # 2. Client (Static Site)
  - type: static
    name: syncexc-client
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://syncexc-server.onrender.com/api/v1 # Update after server deploys

  # 3. Admin (Static Site)
  - type: static
    name: syncexc-admin
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=admin
    staticPublishPath: ./admin/dist
    envVars:
      - key: VITE_API_URL
        value: https://syncexc-server.onrender.com/api/v1 # Update after server deploys