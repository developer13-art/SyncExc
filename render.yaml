services:
  # 1. Backend API (Node.js Web Service)
  - type: web
    name: syncexc-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # Add your secrets (DATABASE_URL, JWT_SECRET, etc.) in the Render Dashboard

  # 2. Client (Static Site - Corrected)
  - type: web              # Must be 'web' for static sites
    runtime: static        # Must be 'static'
    name: syncexc-client
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://syncexc-server.onrender.com/api/v1 # Update after server deploys

  # 3. Admin (Static Site - Corrected)
  - type: web              # Must be 'web' for static sites
    runtime: static        # Must be 'static'
    name: syncexc-admin
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=admin
    staticPublishPath: ./admin/dist
    envVars:
      - key: VITE_API_URL
        value: https://syncexc-server.onrender.com/api/v1 # Update after server deploys